<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>NEON TYPING - HIGH ROLLER TIME ATTACK</title>
  <style>
    :root {
      --gold-primary: #bf9b30;
      --gold-light: #e5c158;
      --red-accent: #b22222;
      --dark-wood: #1e130c;
      --panel-bg: #2d1b10;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: radial-gradient(circle, #3a0d0d 0%, #110303 100%);
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }

    .casino-frame {
      position: relative;
      background: linear-gradient(145deg, var(--panel-bg), var(--dark-wood));
      border: 6px solid var(--gold-primary);
      border-radius: 16px;
      padding: 30px;
      width: 560px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(191, 155, 48, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold-light);
      margin: 0 0 20px 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid var(--gold-primary);
      padding-bottom: 10px;
    }

    .status-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .status-panel span { color: var(--gold-light); }
    .timer-highlight { color: #ff3333 !important; font-size: 18px; }

    .slot-machine {
      background: #0a0a0a;
      border: 4px solid var(--gold-primary);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px #000;
    }

    .reels-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .reel {
      width: 100px;
      height: 90px;
      background: linear-gradient(180deg, #111 0%, #fff 40%, #fff 60%, #111 100%);
      border: 3px solid var(--gold-light);
      border-radius: 8px;
      font-size: 40px;
      line-height: 90px;
      color: #111;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .reel.spinning { animation: spinReel 0.1s linear infinite; }
    @keyframes spinReel {
      0% { transform: translateY(-5px); }
      50% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }

    .effect-display { font-size: 14px; color: #ffcc00; min-height: 20px; font-weight: bold; }

    .typing-area {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .target-jp { font-size: 20px; color: #e5c158; margin-bottom: 4px; }
    .target-romaji { font-size: 30px; font-weight: bold; letter-spacing: 2px; color: #00ffff; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); margin-bottom: 12px; }

    input[type="text"] {
      width: 85%;
      padding: 10px;
      font-size: 22px;
      text-align: center;
      background: #111;
      color: #fff;
      border: 2px solid var(--gold-primary);
      border-radius: 6px;
      outline: none;
    }

    /* 訪問者数カウンタースタイル */
    .visitor-counter {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      padding: 6px 12px;
      margin-bottom: 15px;
      font-size: 13px;
      color: var(--gold-light);
    }
    .visitor-counter span {
      font-weight: bold;
      color: #00ffff;
    }

    /* コメントエリアスタイル */
    .comments-section {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
    }
    .comments-section h2 {
      font-size: 16px;
      color: var(--gold-light);
      margin: 0 0 10px 0;
      border-bottom: 1px dashed var(--gold-primary);
      padding-bottom: 5px;
    }
    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }
    .comment-form input, .comment-form textarea {
      background: #111;
      border: 1px solid var(--gold-primary);
      border-radius: 4px;
      color: #fff;
      padding: 8px;
      font-family: inherit;
    }
    .comment-form textarea {
      resize: vertical;
      min-height: 50px;
    }
    .btn-submit {
      align-self: flex-end;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-primary));
      color: #000;
      border: none;
      padding: 6px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-submit:hover { background: #fff; }
    .comment-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .comment-card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--gold-primary);
      padding: 8px 30px 8px 8px;
      border-radius: 0 4px 4px 0;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gold-light);
      margin-bottom: 4px;
    }
    .comment-text {
      font-size: 13px;
      color: #f0e6d2;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .btn-delete-comment {
      position: absolute;
      top: 6px;
      right: 6px;
      background: transparent;
      border: none;
      color: #ff6666;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
    }
    .btn-delete-comment:hover {
      background: rgba(255, 0, 0, 0.2);
      color: #ff3333;
    }

    /* ゲームオーバー・リザルト表示エリア */
    .result-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 5, 5, 0.95);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
      padding: 20px;
    }
    .hidden { display: none !important; }

    .result-title { font-size: 28px; color: var(--gold-light); margin-bottom: 15px; text-shadow: 0 0 10px var(--gold-primary); }
    .result-score-banner {
      font-size: 22px;
      color: #fff;
      background: rgba(191, 155, 48, 0.2);
      border: 2px solid var(--gold-primary);
      padding: 10px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .result-score-banner span {
      font-size: 32px;
      color: #00ffff;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
    }
    .result-stats { font-size: 16px; margin-bottom: 25px; line-height: 1.8; text-align: left; }
    .btn-retry {
      background: linear-gradient(180deg, var(--gold-light), var(--gold-primary));
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-retry:hover { background: #fff; }
    .space-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--gold-light);
      opacity: 0.8;
    }

    .flash-rainbow { animation: rainbow 0.4s infinite; }
    .flash-red { animation: flashRed 0.3s; }
    @keyframes rainbow { 0% { border-color: red; } 33% { border-color: gold; } 66% { border-color: blue; } 100% { border-color: red; } }
    @keyframes flashRed { 0% { background-color: rgba(255,0,0,0.5); } 100% { background-color: transparent; } }

    .debug-info { font-size: 11px; color: #aaa; text-align: left; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
  </style>
</head>
<body>

<div class="casino-frame" id="main-frame">
  <h1>♣ NEON TYPING - 60s TIME ATTACK ♠</h1>

  <div class="visitor-counter">
    VISITOR COUNT: <span id="visitor-count">1</span>
  </div>

  <div class="status-panel">
    <div>TIME: <span id="timer" class="timer-highlight">60</span>s</div>
    <div>SCORE: <span id="score">0</span></div>
    <div>COMBO: <span id="combo">0</span></div>
  </div>

  <div class="slot-machine">
    <div class="reels-container">
      <div id="reel1" class="reel">🎰</div>
      <div id="reel2" class="reel">🎰</div>
      <div id="reel3" class="reel">🎰</div>
    </div>
    <div id="effect-display" class="effect-display">TYPE TO SPIN! (PRESS SPACE TO RESET)</div>
  </div>

  <div class="typing-area">
    <div id="target-jp" class="target-jp">-</div>
    <div id="target-romaji" class="target-romaji">-</div>
    <input type="text" id="type-input" placeholder="Type here..." autofocus autocomplete="off">
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen" class="result-overlay hidden">
    <div class="result-title">★ TIME UP / RESULT ★</div>
    <div class="result-score-banner">
      FINAL SCORE: <span id="res-score">0</span> pt
    </div>
    <div class="result-stats">
      MAX COMBO   : <span id="res-combo" style="color:#00ffff;">0</span><br>
      SUCCESSES   : <span id="res-success">0</span> 回<br>
      MISSES      : <span id="res-miss" style="color:#ff4444;">0</span> 回
    </div>
    <button class="btn-retry" onclick="resetGame()">PLAY AGAIN</button>
    <div class="space-hint">Press [ SPACE ] to Restart</div>
  </div>

  <div class="comments-section">
    <h2>💬 PLAYER COMMENTS</h2>
    <div class="comment-form">
      <input type="text" id="comment-name" placeholder="Name" maxlength="15">
      <textarea id="comment-text" placeholder="Leave a message..." maxlength="100"></textarea>
      <button class="btn-submit" onclick="addComment()">POST</button>
    </div>
    <div class="comment-list" id="comment-list"></div>
  </div>

  <div class="debug-info">
    MODE: <span id="debug-mode" style="color: #ff9800;">NORMAL</span> | 
    LAST: <span id="debug-result">-</span>
  </div>
</div>

<script>
  // Web Audio API
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
  function playKeySound() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
  }
  function playSpinSound() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
  function playWinSound() {
    initAudio();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }, idx * 80);
    });
  }
  function playMissSound() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  // 設定＆変数
  const MODES = { HELL: 'HELL', NORMAL: 'NORMAL', HEAVEN: 'HEAVEN' };
  const MODE_CONFIG = {
    [MODES.HELL]:   { winRate: 0.05 },
    [MODES.NORMAL]: { winRate: 0.20 },
    [MODES.HEAVEN]: { winRate: 0.70 }
  };
  const SYMBOLS = ["7", "💎", "🔔", "🍒", "BAR"];
  const WORD_LIST = [
    { jp: "勝負（しょうぶ）", romaji: "shoubu" },
    { jp: "天国（てんごく）", romaji: "tengoku" },
    { jp: "一撃（いちげき）", romaji: "ichigeki" },
    { jp: "幸運（こううん）", romaji: "kouun" },
    { jp: "激熱（げきあつ）", romaji: "gekiatsu" },
    { jp: "逆転（ぎゃくてん）", romaji: "gyakuten" },
    { jp: "確率（かくりつ）", romaji: "kakuritsu" },
    { jp: "カジノ", romaji: "casino" },
    { jp: "スロット", romaji: "slot" },
    { jp: "ジャックポット", romaji: "jackpot" }
  ];

  let gameState = {
    timeLeft: 60,
    score: 0,
    combo: 0,
    maxCombo: 0,
    successes: 0,
    misses: 0,
    currentMode: MODES.NORMAL,
    isPlaying: false
  };

  let timerInterval = null;
  let currentWordObj = null;

  window.onload = () => {
    document.getElementById('type-input').addEventListener('input', handleInput);
    
    // キーボード入力（スペースキー監視）
    window.addEventListener('keydown', (e) => {
      // コメント欄を入力している間はスペースキーリセットを無視
      if (document.activeElement.id === 'comment-name' || document.activeElement.id === 'comment-text') {
        return;
      }

      if (e.code === 'Space') {
        // ゲーム終了時 または 未開始時にスペースキーで再スタート
        if (!gameState.isPlaying) {
          e.preventDefault();
          resetGame();
        }
      }
    });

    initVisitorCounter();
    loadComments();
    resetGame();
  };

  /* --- アクセスカウンター機能 --- */
  function initVisitorCounter() {
    let count = parseInt(localStorage.getItem('neon_visitor_count') || '0', 10);
    count++;
    localStorage.setItem('neon_visitor_count', count);
    document.getElementById('visitor-count').innerText = count;
  }

  /* --- コメント機能 --- */
  function loadComments() {
    const comments = JSON.parse(localStorage.getItem('neon_comments') || '[]');
    const listEl = document.getElementById('comment-list');
    listEl.innerHTML = '';
    
    comments.forEach((c, index) => {
      const card = document.createElement('div');
      card.className = 'comment-card';
      card.innerHTML = `
        <button class="btn-delete-comment" onclick="deleteComment(${index})" title="削除">✕</button>
        <div class="comment-header">
          <span>${escapeHTML(c.name)}</span>
          <span>${c.date}</span>
        </div>
        <div class="comment-text">${escapeHTML(c.text)}</div>
      `;
      listEl.appendChild(card);
    });
  }

  function addComment() {
    const nameInput = document.getElementById('comment-name');
    const textInput = document.getElementById('comment-text');
    const name = nameInput.value.trim() || 'Anonymous';
    const text = textInput.value.trim();

    if (!text) return;

    const comments = JSON.parse(localStorage.getItem('neon_comments') || '[]');
    const now = new Date();
    const dateStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    comments.unshift({ name, text, date: dateStr });
    localStorage.setItem('neon_comments', JSON.stringify(comments));

    textInput.value = '';
    loadComments();
  }

  function deleteComment(index) {
    if (!confirm('このコメントを削除してもよろしいですか？')) return;

    const comments = JSON.parse(localStorage.getItem('neon_comments') || '[]');
    comments.splice(index, 1);
    localStorage.setItem('neon_comments', JSON.stringify(comments));
    loadComments();
  }

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  function resetGame() {
    clearInterval(timerInterval);
    gameState = {
      timeLeft: 60, score: 0, combo: 0, maxCombo: 0,
      successes: 0, misses: 0, currentMode: MODES.NORMAL, isPlaying: true
    };

    document.getElementById('result-screen').classList.add('hidden');
    const inputEl = document.getElementById('type-input');
    inputEl.disabled = false;
    inputEl.value = "";
    inputEl.focus();

    updateStatsDisplay();
    nextWord();

    timerInterval = setInterval(() => {
      gameState.timeLeft--;
      document.getElementById('timer').innerText = gameState.timeLeft;
      if (gameState.timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    clearInterval(timerInterval);
    gameState.isPlaying = false;
    document.getElementById('type-input').disabled = true;

    // 制限時間終了時に最終スコアと各種データを表示
    document.getElementById('res-score').innerText = gameState.score;
    document.getElementById('res-combo').innerText = gameState.maxCombo;
    document.getElementById('res-success').innerText = gameState.successes;
    document.getElementById('res-miss').innerText = gameState.misses;
    document.getElementById('result-screen').classList.remove('hidden');
  }

  function nextWord() {
    currentWordObj = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
    document.getElementById('target-jp').innerText = currentWordObj.jp;
    document.getElementById('target-romaji').innerText = currentWordObj.romaji;
  }

  function handleInput(e) {
    if (!gameState.isPlaying) return;

    const inputVal = e.target.value.toLowerCase();
    const targetRomaji = currentWordObj.romaji.toLowerCase();

    if (!targetRomaji.startsWith(inputVal)) {
      playMissSound();
      e.target.value = "";
      gameState.combo = 0;
      gameState.misses++;
      
      const area = document.querySelector('.typing-area');
      area.classList.add('flash-red');
      setTimeout(() => area.classList.remove('flash-red'), 300);

      processSlotSpin(false);
      nextWord();
      return;
    }

    playKeySound();

    if (inputVal === targetRomaji) {
      e.target.value = "";
      gameState.combo++;
      gameState.successes++;
      if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
      
      processSlotSpin(true);
      nextWord();
    }
  }

  function processSlotSpin(isTypeSuccess) {
    const r1 = document.getElementById('reel1'), r2 = document.getElementById('reel2'), r3 = document.getElementById('reel3');
    r1.classList.add('spinning'); r2.classList.add('spinning'); r3.classList.add('spinning');
    
    if (isTypeSuccess) playSpinSound();

    let config = MODE_CONFIG[gameState.currentMode];
    let isWin = isTypeSuccess ? (Math.random() < config.winRate) : false;

    setTimeout(() => {
      r1.classList.remove('spinning'); r2.classList.remove('spinning'); r3.classList.remove('spinning');

      let reelsResult = [];
      if (isWin) {
        reelsResult = ["7", "7", "7"];
        playWinSound();
        gameState.score += 500;
      } else {
        const sym1 = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        let sym2 = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        let sym3 = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        if (sym1 === sym2 && sym2 === sym3) sym3 = (sym3 === "7") ? "🍒" : "7";
        reelsResult = [sym1, sym2, sym3];
        if (isTypeSuccess) gameState.score += 10;
      }

      r1.innerText = reelsResult[0]; r2.innerText = reelsResult[1]; r3.innerText = reelsResult[2];
      gameState.currentMode = updateMode(gameState.currentMode, isWin, gameState.combo);
      renderUI(isWin, isTypeSuccess);
    }, 200);
  }

  function updateMode(currentMode, isWin, combo) {
    const r = Math.random();
    const comboBonus = combo >= 3 ? 0.20 : 0.0;
    if (currentMode === MODES.NORMAL) {
      if (isWin) return (r < 0.30 + comboBonus) ? MODES.HEAVEN : MODES.NORMAL;
      return r < 0.02 ? MODES.HELL : MODES.NORMAL;
    } else if (currentMode === MODES.HEAVEN) {
      return (isWin || r < 0.60) ? MODES.HEAVEN : MODES.NORMAL;
    }
    return MODES.NORMAL;
  }

  function updateStatsDisplay() {
    document.getElementById('timer').innerText = gameState.timeLeft;
    document.getElementById('score').innerText = gameState.score;
    document.getElementById('combo').innerText = gameState.combo;
  }

  function renderUI(isWin, isTypeSuccess) {
    updateStatsDisplay();
    const effectEl = document.getElementById('effect-display');
    const mainFrame = document.getElementById('main-frame');

    if (!isTypeSuccess) {
      effectEl.innerText = "MISS! (COMBO RESET)";
    } else if (isWin) {
      effectEl.innerText = "★ WIN! (+500pt) ★";
      mainFrame.classList.add('flash-rainbow');
      setTimeout(() => mainFrame.classList.remove('flash-rainbow'), 1000);
    } else {
      effectEl.innerText = gameState.currentMode === MODES.HEAVEN ? "🔥 HIGH CHANCE MODE 🔥" : "CASINO NIGHT";
    }

    document.getElementById('debug-mode').innerText = gameState.currentMode;
    document.getElementById('debug-result').innerText = !isTypeSuccess ? "MISS" : (isWin ? "WIN" : "LOSE");
  }
</script>

</body>
</html>
